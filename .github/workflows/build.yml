name: Build PS3 Game

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Extract PS3 Toolchain
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
          tar -xzf ps3dev-ubuntu-latest-2020-08-31.tar.gz

      - name: Patch missing ppu_rules and Set Environment
        run: |
          # Find Makefile.base to figure out where the SDK actually is
          MB_PATH=$(find ${{ github.workspace }}/ps3dev -name "Makefile.base" | head -n 1)
          if [ -z "$MB_PATH" ]; then
            echo "ERROR: Could not find Makefile.base anywhere!"
            exit 1
          fi
          
          PSL1GHT_DIR=$(dirname "$MB_PATH")
          echo "PSL1GHT=$PSL1GHT_DIR" >> $GITHUB_ENV
          echo "PS3DEV=${{ github.workspace }}/ps3dev" >> $GITHUB_ENV
          echo "Found PSL1GHT at: $PSL1GHT_DIR"

          # Find ppu_rules and copy it into the PSL1GHT folder
          PPU_RULES=$(find ${{ github.workspace }}/ps3dev -name "ppu_rules" | head -n 1)
          if [ -n "$PPU_RULES" ]; then
            cp "$PPU_RULES" "$PSL1GHT_DIR/ppu_rules"
            echo "Successfully patched ppu_rules!"
          else
            echo "ERROR: Could not find ppu_rules!"
            exit 1
          fi

      - name: Setup PATH
        run: |
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Build and Install tiny3d (Graphics)
        run: |
          git clone https://github.com/wargio/tiny3d.git
          cd tiny3d
          make
          make install

      - name: Build and Install ps3soundlib (Audio)
        run: |
          git clone https://github.com/wargio/ps3soundlib.git
          cd ps3soundlib
          make
          make install

      - name: Build the Game
        run: |
          make -f Makefile.ps3

      - name: Upload Compiled Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Game-Build
          path: skycircuit.self
