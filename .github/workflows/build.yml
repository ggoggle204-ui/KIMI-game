name: Build KIMI-game PS3

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PS3DEV: ${{ github.workspace }}/ps3dev
  PSL1GHT: ${{ github.workspace }}/ps3dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make \
            texinfo libncurses5-dev patch python3 python-is-python3 subversion wget \
            zlib1g-dev libtool-bin python3-dev bzip2 libgmp3-dev pkg-config git g++ libssl-dev clang

      - name: Configure download retries
        run: |
          printf 'tries = 5\nretry_connrefused = on\nwaitretry = 10\ntimeout = 60\n' >> ~/.wgetrc
          printf 'retry = 5\nretry-delay = 10\nretry-all-errors\nconnect-timeout = 30\n' >> ~/.curlrc
          mkdir -p "${{ github.workspace }}/logs"

      - name: Restore full toolchain cache
        id: cache_full
        uses: actions/cache/restore@v4
        with:
          path: ps3dev
          key: ps3dev-full-v4

      - name: Restore core toolchain cache
        id: cache_core
        if: steps.cache_full.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ps3dev
          key: ps3dev-core-v4

      - name: Get ps3toolchain
        if: steps.cache_full.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$PS3DEV"
          git clone --depth=1 https://github.com/ps3dev/ps3toolchain.git ps3toolchain-src

      - name: Stage A - build core toolchain (GCC, binutils, PSL1GHT)
        if: steps.cache_full.outputs.cache-hit != 'true' && steps.cache_core.outputs.cache-hit != 'true'
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          cd ps3toolchain-src
          mkdir -p /tmp/hold
          mv scripts/*ps3libraries*.sh /tmp/hold/
          ./toolchain.sh > "${{ github.workspace }}/logs/stage-a.log" 2>&1 \
            || { tail -n 150 "${{ github.workspace }}/logs/stage-a.log"; exit 1; }
          mv /tmp/hold/*.sh scripts/

      - name: Save core toolchain cache
        if: steps.cache_full.outputs.cache-hit != 'true' && steps.cache_core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ps3dev
          key: ps3dev-core-v4

      - name: Stage B - build ps3libraries (zlib, freetype)
        if: steps.cache_full.outputs.cache-hit != 'true'
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          LOG="${{ github.workspace }}/logs/stage-b.log"
          cd ps3toolchain-src
          mkdir -p /tmp/hold
          for f in scripts/*.sh; do
            case "$f" in *ps3libraries*) ;; *) mv "$f" /tmp/hold/ ;; esac
          done
          ls scripts/*ps3libraries*.sh || { echo "ps3libraries script not found"; exit 1; }

          for attempt in 1 2; do
            echo "=== ps3libraries attempt $attempt ===" | tee -a "$LOG"
            if ./toolchain.sh >> "$LOG" 2>&1; then echo "ps3libraries fully built"; break; fi
            echo "attempt $attempt stopped early; last lines:"; tail -n 15 "$LOG"
          done
          mv /tmp/hold/*.sh scripts/

          L="$PS3DEV/portlibs/ppu/lib"
          ls "$L" || true
          missing=0
          for lib in libz.a libfreetype.a; do
            if [ -f "$L/$lib" ]; then echo "OK: $lib installed"; else echo "MISSING: $lib"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "A needed library was not built:"; tail -n 100 "$LOG"; exit 1; fi

      - name: Save full toolchain cache
        if: steps.cache_full.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ps3dev
          key: ps3dev-full-v4

      - name: Build and Install tiny3d (Manual Patch)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          git clone https://github.com/wargio/tiny3d.git
          cd tiny3d
          make
          mkdir -p "$PS3DEV/portlibs/ppu/lib" "$PS3DEV/portlibs/ppu/include"
          cp libtiny3d.a "$PS3DEV/portlibs/ppu/lib/" || true
          cp *.h "$PS3DEV/portlibs/ppu/include/" || true
          echo "tiny3d installed manually."

      - name: Build and Install ps3soundlib (Manual Patch)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          git clone https://github.com/wargio/ps3soundlib.git
          cd ps3soundlib
          make
          mkdir -p "$PS3DEV/portlibs/ppu/lib" "$PS3DEV/portlibs/ppu/include"
          cp libps3soundlib.a "$PS3DEV/portlibs/ppu/lib/" || true
          cp -r include/* "$PS3DEV/portlibs/ppu/include/" || true
          echo "ps3soundlib installed manually."

      - name: Compile Game (Force Correct Rules & Tabs)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          
          # 1. Download the CORRECT base rules file directly from PSL1GHT
          git clone --depth=1 https://github.com/ps3dev/PSL1GHT.git psl1ght-src
          cp psl1ght-src/base_rules $PS3DEV/Makefile.base
          cp psl1ght-src/ppu_rules $PS3DEV/ppu_rules
          cp psl1ght-src/spu_rules $PS3DEV/spu_rules
          
          # 2. Force Tabs in the Makefile to fix mobile editor spaces
          sed -i 's/^[ ]*/\t/' Makefile.ps3
          
          # 3. Compile
          make -f Makefile.ps3

      - name: Upload PS3 Build
        uses: actions/upload-artifact@v4
        with:
          name: KIMI-game-PS3
          path: |
            skycircuit.self
            skycircuit.elf
